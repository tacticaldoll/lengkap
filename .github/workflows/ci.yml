name: ci

on:
  push:
  pull_request:

jobs:
  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build, test, lint, format, and document
        run: |
          cargo build --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo fmt --all --check
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: changelog ledger
        run: ./scripts/changelog-guard.sh

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install and select the declared MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88
      - name: workspace builds on the declared MSRV
        run: cargo +1.88 build --workspace
      - name: check every workspace target on the declared MSRV
        run: cargo +1.88 check --workspace --all-targets

  product-msrv:
    name: Product minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: check publishable product targets on Rust 1.85.0
        run: >-
          cargo +1.85.0 check
          -p lengkap-contract -p lengkap
          --all-targets

  semver:
    name: Public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare product crates with crates.io 0.1.0
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: lengkap-contract,lengkap
          baseline-version: 0.1.0

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: license / advisory / bans / sources policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  governance:
    name: Tianheng reaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: architecture constitution passes
        run: cargo run -p lengkap-governance -- check --manifest-path Cargo.toml
